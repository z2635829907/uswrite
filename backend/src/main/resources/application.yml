server:
  port: 8080

spring:
  application:
    name: shiguang-blog
  datasource:
    url: jdbc:mysql://localhost:3306/shiguang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

app:
  jwt:
    secret: "shiguang-blog-jwt-secret-key-2026-change-me-in-production"
    expiration-ms: 604800000
  llm:
    base-url: ${SPRING_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${SPRING_LLM_API_KEY:}
    model: ${SPRING_LLM_MODEL:deepseek-chat}
    embedding-model: ${SPRING_LLM_EMBEDDING_MODEL:text-embedding-3-small}
    temperature: 0.4
    max-tokens: 800
